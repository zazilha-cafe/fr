<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>ZAZIL'HA — Café de México</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #ffffff;
      overflow-x: hidden;
    }

    .landing-image {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <img
    class="landing-image"
    src="part1.jpg?v=1"
    alt="ZAZIL'HA Café de México"
    fetchpriority="high"
  >

  <img
    class="landing-image"
    src="part2.jpg?v=1"
    alt="Sélection de cafés ZAZIL'HA"
    loading="lazy"
  >

  <img
    class="landing-image"
    src="part3.jpg?v=1"
    alt="ZAZIL'HA pour les professionnels"
    loading="lazy"
  >

</body>

</html>
